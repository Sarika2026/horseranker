<!DOCTYPE html>
<html>
<head>
  <title>Horseranker 3.1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; padding: 15px; background: #111; color: #eee; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #444; padding: 8px; text-align: left; }
    th { background: #222; }
    pre { background: #222; padding: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2 id="version">Loading...</h2>
  <h3 id="range"></h3>
  <pre id="raw"></pre>
  
  <table>
    <thead>
      <tr><th>Horse</th><th>Jockey</th><th>Weight</th><th>Odds</th></tr>
    </thead>
    <tbody id="horseTable">
      <tr><td colspan="4">Loading data...</td></tr>
    </tbody>
  </table>

<script>
fetch('data.json?v=3.1')
  .then(res => {
    if(!res.ok) throw new Error('data.json not found');
    return res.json();
  })
  .then(data => {
    document.getElementById('version').innerText = 'Version: ' + data.version + ' | ' + data.date;
    document.getElementById('range').innerText = data.range;
    document.getElementById('raw').innerText = data.raw;
    
    let rows = '';
    data.horses.forEach(h => {
      rows += `<tr><td>${h.name}</td><td>${h.jockey}</td><td>${h.weight}</td><td>${h.odds}</td></tr>`;
    });
    document.getElementById('horseTable').innerHTML = rows;
  })
  .catch(err => {
    document.getElementById('version').innerText = 'Error: ' + err;
    console.log(err);
  });
</script>
</body>
</html>
