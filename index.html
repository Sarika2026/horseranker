<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheet1 - Tabtouch Ranker</title>
<style>
  body{font-family:Arial;margin:5px;background:#eee;font-size:12px}
 .btn{padding:8px 12px;background:#007bff;color:#fff;border:0;border-radius:4px;font-size:14px;margin-right:5px}
 .btn.green{background:#28a745}
 .btn.orange{background:#fd7e14}
 .header{background:#fff;padding:8px;border-radius:4px;margin:8px 0;font-weight:bold}
  table{width:100%;border-collapse:collapse;background:#fff;margin-top:5px;font-size:11px}
  td,th{border:1px solid #ddd;padding:4px;text-align:center;white-space:nowrap;cursor:pointer}
  th{background:#f1f1f1}
 .colA{width:30px;font-weight:bold}
 .colD{text-align:left;padding-left:5px}
  input{width:95%;padding:5px;margin-bottom:8px;border:1px solid #ccc;border-radius:4px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<input id="url" placeholder="Paste Tabtouch Race URL here" value="https://www.tabtouch.com.au/racing/2026-08-05/orb/1">

<button class="btn" onclick="loadData()">🔄 Refresh</button>
<button class="btn green" onclick="rankHorses()">🏆 Rank Horses</button>
<button class="btn orange" onclick="downloadExcel()">📥 Download Excel</button>

<div id="head" class="header">Q5: - Q4: - Q20: -</div>
<div id="tbl">Click Refresh to load data</div>

<script>
let currentData = [];
let sortCol = -1;
let sortAsc = true;

// DEMO DATA - Replace this with API call later
const DEMO = {
  runners: [
    {number:1,name:"Fast Horse",odds:3.50,jockey:"J Smith",barrier:4},
    {number:2,name:"Slow Runner",odds:26.00,jockey:"A Lee",barrier:2},
    {number:3,name:"Mid One",odds:8.00,jockey:"K Brown",barrier:7},
    {number:4,name:"Long Shot",odds:45.00,jockey:"M Davis",barrier:1},
    {number:5,name:"Fav",odds:2.20,jockey:"P Jones",barrier:3},
  ]
}

function processRace(data, raceId) {
    let horses = [...data.runners].sort((a,b) => a.number - b.number);
    const noHorses = horses.length;
    let e = 0, d = 0;
    horses.forEach(h => {
        if(h.odds > 1.1 && h.odds < 23.25) e++;
        if(h.odds >= 23.25 && h.odds <= 66.66) d++;
    });
    
    let rows = horses.map((h, i) => {
        let A = i + 1; let D = h.name || "";
        let K = parseFloat(h.odds) || 0;
        let P = " "; // Will calculate after 2nd refresh
        let H = K; 
        let color = i === 0? 4 : i <= 5? 35 : i <= 7? 38 : i === 8? 39 : i <= 12? 46 : 0;
        return { A, D, J: h.number, K, L: h.jockey, N: h.barrier, H, P, color, rank: A }
    });
    
    let Q5 = e + " + " + d;
    let fication = (e+d)<=8.1?"X":(e+d)>=10&&(e+d)<=12.1&&e<=8.9?"A":(e+d)>=10&&(e+d)<=12.1&&e>=9?"B":(e+d)>=13&&e<=8.9?"D":(e+d)>=13&&(e+d)<=14.1&&e>=9?"E":(e+d)>=15&&e>=9?"H":"";
    let yyy = "no"; if((e+d)>=10&&(e+d)<=12.1&&noHorses>=14) yyy="B14/BE YES "; if((e+d)>=13&&(e+d)<=20.1&&e===5) yyy="yes D5"; if((e+d)>=15&&e>=9) yyy="H YES";
    let yyyColor = yyy.includes("YES")?4:yyy.includes("no")?0:26;
    return {rows, Q5, Q4:fication, Q20:yyy, Q20Color:yyyColor};
}

function render(data){
  currentData = data.rows;
  document.getElementById("head").innerHTML = 
    '<b>Q5:</b>'+data.Q5+' <b>Q4:</b>'+data.Q4+' <b>Q20:</b><span style="background:'+getC(data.Q20Color)+';padding:2px 4px">'+data.Q20+'</span>';
  
  let h="<table><tr>"+
    th("Rank","rank")+th("A","A")+th("Horse","D")+th("No","J")+th("Odds","K")+th("H","H")+th("Barrier","N")+th("P%","P")+
    "</tr>";
  
  currentData.forEach((x)=>{
    let bg=getC(x.color);
    h+='<tr style="background:'+bg+'"><td>'+x.rank+'</td><td class=colA>'+x.A+'</td><td class=colD>'+x.D+'</td><td>'+x.J+'</td><td>'+x.K+'</td><td>'+x.H+'</td><td>'+x.N+'</td><td>'+x.P+'%</td></tr>'
  });
  document.getElementById("tbl").innerHTML=h+"</table>";
}

function th(name, key){
  return '<th onclick="sortTable(\''+key+'\')">'+name+' ↕</th>'
}

function sortTable(key){
  if(sortCol === key) sortAsc =!sortAsc; else sortAsc = true;
  sortCol = key;
  currentData.sort((a,b)=>{
    if(a[key] < b[key]) return sortAsc? -1 : 1;
    if(a[key] > b[key]) return sortAsc? 1 : -1;
    return 0;
  });
  render({rows:currentData, Q5:"", Q4:"", Q20:"", Q20Color:0});
}

function rankHorses(){
  currentData.sort((a,b)=>a.K - b.K); // Rank by lowest odds = Fav
  currentData.forEach((x,i)=>x.rank = i+1);
  render({rows:currentData, Q5:"", Q4:"", Q20:"", Q20Color:0});
}

function downloadExcel(){
  const ws = XLSX.utils.json_to_sheet(currentData.map(x=>({
    Rank:x.rank, A:x.A, Horse:x.D, No:x.J, Odds:x.K, H:x.H, Barrier:x.N, "P%":x.P
  })));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
  XLSX.writeFile(wb, "Sheet1_Ranked.xlsx");
}

function getC(i){return {4:"#0f0",35:"#92D050",38:"#FFC000",39:"#f00",46:"#FF9966",26:"#FFD700",0:"#fff"}[i]||"#fff"}

function loadData(){
  document.getElementById("tbl").innerHTML="Loading Demo...";
  setTimeout(()=>{
    let url = document.getElementById("url").value;
    let raceId = url.split("/").slice(-2).join("_");
    let data = processRace(DEMO, raceId);
    render(data);
  }, 500);
}

// Auto load
loadData();
</script>
</body>
</html>
