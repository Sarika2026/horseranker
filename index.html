<!DOCTYPE html>
<html>
<head>
<title>HorseRanker V4 - Tabtouch Table</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body {font-family: Arial; padding: 20px; background:#0a0a0a; color:#fff;}
  input, button {padding:12px; margin:10px 0; background:#222; color:#fff; border:1px solid #555; border-radius:5px;}
  button {background:#00ff88; color:#000; font-weight:bold; cursor:pointer; font-size:16px;}
  table {width:100%; border-collapse: collapse; margin-top:20px; background:#111;}
  th, td {border:1px solid #333; padding:10px; text-align:center;}
  th {background:#00ff88; color:#000; font-weight:bold;}
 .rank1 {background:#1a331a;} /* Green for #1 */
 .rank2 {background:#1a2a33;} /* Blue for #2 */
 .rank3 {background:#332a1a;} /* Brown for #3 */
</style>
</head>
<body>
<h1>🏇 HorseRanker V4 - Excel Style</h1>
<p>1. Download Excel from Tabtouch > 2. Upload below</p>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
<br>
<button onclick="readFile()">RANK HORSES</button>

<div id="results"></div>

<script>
function readFile(){
  let file = document.getElementById('fileInput').files[0];
  if(!file){ alert("Please select Excel file first"); return; }

  let reader = new FileReader();
  reader.onload = function(e){
    let data = new Uint8Array(e.target.result);
    let workbook = XLSX.read(data, {type: 'array'});
    let sheet = workbook.Sheets[workbook.SheetNames[0]];
    let rows = XLSX.utils.sheet_to_json(sheet, {defval: ""});
    rankHorses(rows);
  };
  reader.readAsArrayBuffer(file);
}

function rankHorses(rows){
  let horses = [];

  rows.forEach((row, index) => {
    if(String(row.scratched).toUpperCase() === "TRUE") return;

    let number = row.number || (index + 1);
    let name = row.starterName;
    let jockey = row.staterName2 || '';
    let odds = parseFloat(row.winDiv) || 99;
    let weight = parseFloat(row.weight) || 57;
    let barrier = parseInt(row.barrier) || 99;

    if(name && name.trim()!== ""){
      let oddsScore = (1/odds) * 100;
      let weightScore = (62 - weight) * 2;
      let barrierScore = (barrier >=1 && barrier <=10)? (11 - barrier) * 2 : 0;
      let score = oddsScore + weightScore + barrierScore;
      horses.push({rank:0, number, name, jockey, odds, weight, barrier, score});
    }
  });

  horses.sort((a,b) => b.score - a.score);
  horses.forEach((h,i) => h.rank = i+1);

  // Build Excel-like table
  let table = `<h3>🏆 RANKED RESULTS - LIKE SHEET1</h3>
  <table>
    <tr>
      <th>Rank</th><th>No</th><th>Horse</th><th>Jockey</th>
      <th>Odds</th><th>Weight</th><th>Barrier</th><th>Score</th>
    </tr>`;

  horses.forEach(h => {
    let rowClass = h.rank===1? 'rank1' : h.rank===2? 'rank2' : h.rank===3? 'rank3' : '';
    table += `<tr class="${rowClass}">
      <td><b>${h.rank}</b></td>
      <td>${h.number}</td>
      <td>${h.name}</td>
      <td>${h.jockey}</td>
      <td>$${h.odds}</td>
      <td>${h.weight}kg</td>
      <td>${h.barrier}</td>
      <td><b>${h.score.toFixed(2)}</b></td>
    </tr>`;
  });
  table += `</table>`;

  document.getElementById('results').innerHTML = table;
}
</script>
</body>
</html>
