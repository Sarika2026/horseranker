<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabtouch Fetcher</title>
<style>body{font-family:Arial; padding:10px; background:#111; color:#eee}
input,button{padding:10px; margin:5px; width:95%; font-size:16px}
table{width:100%; border-collapse:collapse; margin-top:10px}
td,th{border:1px solid #444; padding:6px; text-align:left}
th{background:#222}</style>
</head>
<body>
<h2>Tabtouch Race Fetcher</h2>
<input id="race" value="https://www.tabtouch.com.au/racing/2026-08-05/orb/6">
<input id="user" placeholder="Tabtouch Username">
<input id="pass" type="password" placeholder="Tabtouch Password">
<button onclick="fetchRace()">FETCH RACE</button>
<div id="status"></div><div id="results"></div>
<script>
const API_URL = "https://tabtouch-api.onrender.com"; // <-- CHANGE THIS

async function fetchRace(){
  document.getElementById('status').innerText = "Fetching...";
  let res = await fetch(API_URL + '/api/tabtouch', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      url: document.getElementById('race').value,
      username: document.getElementById('user').value,
      password: document.getElementById('pass').value
    })
  });
  let data = await res.json();
  if(data.ok){
    document.getElementById('status').innerText = "Done";
    let table = `<table><tr><th>No</th><th>Horse</th><th>Jockey</th><th>Barrier</th><th>Odds</th></tr>`;
    data.horses.forEach(h => {
      table += `<tr><td>${h.J}</td><td>${h.K}</td><td>${h.L}</td><td>${h.N}</td><td>${h.M}</td></tr>`;
    });
    table += `</table>`;
    document.getElementById('results').innerHTML = table;
  } else {
    document.getElementById('status').innerText = "Error: " + data.error;
  }
}
</script>
</body>
</html>
