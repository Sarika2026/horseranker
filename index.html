<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheet1 - Tabtouch Ranker CSV</title>
<style>
  body{font-family:Arial;margin:5px;background:#eee;font-size:11px}
.btn{padding:8px 12px;background:#007bff;color:#fff;border:0;border-radius:4px;font-size:14px;margin-right:5px;margin-bottom:5px;cursor:pointer}
.btn.green{background:#28a745}
.btn.orange{background:#fd7e14}
.btn.red{background:#dc3545}
.header{background:#fff;padding:8px;border-radius:4px;margin:8px 0;font-weight:bold}
.info{background:#fff;padding:6px;border-radius:4px;margin:8px 0;font-size:13px;font-weight:bold}
.info span{margin-right:15px;color:#007bff}
  table{width:100%;border-collapse:collapse;background:#fff;margin-top:5px;font-size:10px;overflow-x:auto;display:block}
  td,th{border:1px solid #ddd;padding:3px;text-align:center;white-space:nowrap;cursor:pointer;min-width:45px}
  th{background:#f1f1f1;position:sticky;top:0;z-index:1}
.colA{width:30px;font-weight:bold}
.colD{text-align:left;padding-left:5px;min-width:120px}
.qcol{background:#f9f9f9}
.qtf-col{font-weight:bold}
  input[type=file]{margin-bottom:8px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<input type="file" id="csvFile" accept=".csv">

<button class="btn" onclick="loadCSV()">Update</button>
<button class="btn green" onclick="sortHorses()">Sort</button>
<button class="btn orange" onclick="downloadExcel()">Download Excel</button>
<button class="btn red" onclick="newRace()">New</button>

<div id="info" class="info">
  <span id="raceName">Race: -</span>
  <span id="starts">Starts: -</span>
  <span id="divis">Divis: -</span>
</div>
<div id="head" class="header">Q5: - Q4: - Q20: -</div>
<div id="tbl">Select CSV file and click Update</div>

<script>
let currentData = [];
let raceInfo = {};

function getQtColor(val){
  val = parseFloat(val) || 0;
  if(val < 20) return "#0f0";
  if(val < 50) return "#92D050";
  if(val < 100) return "#FFC000";
  if(val < 200) return "#f00";
  return "#FF9966";
}
function getTfColor(val){
  val = parseFloat(val) || 0;
  if(val < 300) return "#0f0";
  if(val < 800) return "#92D050";
  if(val < 1500) return "#FFC000";
  return "#f00";
}

function loadCSV(){
  const file = document.getElementById('csvFile').files[0];
  if(!file){ alert("Select a CSV file first"); return; }

  const reader = new FileReader();
  reader.onload = function(e){
    const lines = e.target.result.split('\n');
    const headers = lines[0].split(',');
    let horses = [];

    for(let i=1; i<lines.length; i++){
      if(!lines[i]) continue;
      const values = lines[i].split(',');
      let obj = {};
      headers.forEach((h, idx) => obj[h.trim()] = values[idx]?.trim());
      horses.push(obj);
    }

    raceInfo = {raceName: horses[0].raceName, starts: horses[0].starts, divis: horses[0].divis};
    processAndRender(horses);
  }
  reader.readAsText(file);
}

function processAndRender(horses){
  const noHorses = horses.length;
  let e = 0, d = 0;
  horses.forEach(h => {
    let odds = parseFloat(h.odds);
    if(odds > 1.1 && odds < 23.25) e++;
    if(odds >= 23.25 && odds <= 66.66) d++;
  });

  let rows = horses.map((h, i) => {
    let win = parseFloat(h.win), qt = parseFloat(h.qt), tf = parseFloat(h.tf);
    return {
      rank: i+1, A: i+1, D: h.name, J: h.number, K: h.odds, L: h.jockey, N: h.barrier,
      H: h.odds, P: " ", color: i === 0? 4 : i <= 5? 35 : 0,
      Q1:h.q1,Q2:h.q2,Q3:h.q3,Q4:h.q4,Q5:h.q5,Q6:h.q6,Q7:h.q7,
      Q8:win, Q9:qt, Q10:tf,
      Q8Color:getQtColor(win), Q9Color:getQtColor(qt), Q10Color:getTfColor(tf),
      R1:h.r1,R2:h.r2,R3:h.r3,R4:h.r4,R5:h.r5,R6:h.r6,R7:h.r7,R8:h.r8,R9:h.r9,R10:h.r10
    }
  });

  let Q5 = e + " + " + d;
  let fication = (e+d)<=8.1?"X":(e+d)>=10&&(e+d)<=12.1&&e<=8.9?"A":"B";
  let yyy = "no";
  let yyyColor = 0;

  render({rows, Q5, Q4:fication, Q20:yyy, Q20Color:yyyColor});
}

function render(data){
  currentData = data.rows;
  document.getElementById("raceName").innerHTML = '<b>Race:</b> ' + raceInfo.raceName;
  document.getElementById("starts").innerHTML = '<b>Starts:</b> ' + raceInfo.starts;
  document.getElementById("divis").innerHTML = '<b>Divis:</b> ' + raceInfo.divis;
  document.getElementById("head").innerHTML = '<b>Q5:</b>'+data.Q5+' <b>Q4:</b>'+data.Q4+' <b>Q20:</b><span style="background:'+getC(data.Q20Color)+';padding:2px 4px">'+data.Q20+'</span>';

  let headers = "Rank,A,Horse,No,Odds,H,Barrier,P%,";
  for(let q=1; q<=10; q++) headers += "Q"+q+",";
  for(let r=1; r<=10; r++) headers += "R"+r+",";

  let h="<table><tr>"+headers.split(',').map(x=>'<th>'+x+'</th>').join('')+"</tr>";

  currentData.forEach((x)=>{
    let bg=getC(x.color);
    let row = `<td>${x.rank}</td><td class=colA>${x.A}</td><td class=colD>${x.D}</td><td>${x.J}</td><td>${x.K}</td><td>${x.H}</td><td>${x.N}</td><td>${x.P}%</td>`;
    for(let q=1; q<=10; q++){
      let qColor = q>=8 && q<=10? `style="background:${x['Q'+q+'Color']};color:#000"` : "";
      row += `<td class="qcol qtf-col" ${qColor}>${x['Q'+q]||""}</td>`;
    }
    for(let r=1; r<=10; r++) row += `<td class=qcol>${x['R'+r]||""}</td>`;
    h+='<tr style="background:'+bg+'">'+row+'</tr>'
  });
  document.getElementById("tbl").innerHTML=h+"</table>";
}

function sortHorses(){
  currentData.sort((a,b)=>a.K - b.K);
  currentData.forEach((x,i)=>x.rank = i+1);
  render({rows:currentData, Q5:"", Q4:"", Q20:"", Q20Color:0});
}

function downloadExcel(){
  const ws = XLSX.utils.json_to_sheet(currentData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
  XLSX.writeFile(wb, raceInfo.raceName + ".xlsx");
}

function newRace(){
  document.getElementById("csvFile").value = "";
  document.getElementById("tbl").innerHTML = "Select CSV file and click Update";
  document.getElementById("head").innerHTML = "Q5: - Q4: - Q20: -";
  document.getElementById("raceName").innerHTML = "Race: -";
  document.getElementById("starts").innerHTML = "Starts: -";
  document.getElementById("divis").innerHTML = "Divis: -";
  currentData = [];
}

function getC(i){return {4:"#0f0",35:"#92D050",38:"#FFC000",39:"#f00",46:"#FF9966",26:"#FFD700",0:"#fff"}[i]||"#fff"}
</script>
</body>
</html>
