<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ozbet 2-Min Calc</title>
<style>
    body { font-family: Arial; background:#0a0a0a; color:#eee; padding:10px; max-width:600px; margin:auto; }
    input, button { padding:10px; margin:5px 2px; font-size:16px; border-radius:6px; border:1px solid #444; background:#1a1a1a; color:#eee; }
    button { background:#28a745; border:none; font-weight:bold; width:100%; }
    table { width:100%; border-collapse:collapse; margin-top:15px; font-size:13px; }
    th, td { border:1px solid #333; padding:5px; text-align:center; }
    th { background:#1a1a1a; position:sticky; top:0; }
   .q5 { background:#003300; } /* Green Top 5 */
   .gapbig { color:#ff3333; font-weight:bold; } /* Big Gap */
   pre { background:#000; padding:8px; overflow-x:auto; font-size:11px; max-height:200px; }
    #status { margin-top:10px; color:#ffcc00; font-weight:bold; }
</style>
</head>
<body>

<h2>Ozbet Race Calc</h2>
<input type="text" id="race" placeholder="Race Name" value="BUNBURY">
<input type="number" id="rno" placeholder="R" value="1" style="width:70px">
<input type="text" id="date" placeholder="YYYYMMDD" value="20250805">
<button onclick="getResults()">GET RESULTS</button>

<div id="status">Enter Race and Tap Button</div>

<h3>Raw Data</h3>
<pre id="raw">Waiting...</pre>

<h3>Result Table</h3>
<div id="output"></div>

<script>
const PROXIES = [
    "https://api.allorigins.win/raw?url=",
    "https://corsproxy.io/?",
    "https://api.codetabs.com/v1/proxy?quest="
];

async function getResults(){
    let race = document.getElementById('race').value.toUpperCase().trim();
    let rno = document.getElementById('rno').value;
    let date = document.getElementById('date').value;
    let status = document.getElementById('status');
    let rawBox = document.getElementById('raw');
    let output = document.getElementById('output');
    output.innerHTML = ""; rawBox.innerText = "Fetching...";

    let ozbetURL = `http://www.ozbet.com.au/ozbet/plsql/ozbet.ToteForARace?p_device=TEXT&p_date=${date}&p_fixture_id=${race}&p_contest_number=${rno}`;
    
    let text = "";
    for(let base of PROXIES){
        try{
            status.innerText = "Trying: " + base.split('/')[2];
            let res = await fetch(base + encodeURIComponent(ozbetURL));
            if(!res.ok) continue;
            text = await res.text();
            if(text.length > 20 && !text.includes("Error")) break; // got real data
        }catch(e){}
    }

    rawBox.innerText = text; // HOLD AND SHOW RAW
    
    if(text.length < 20){
        status.innerText = "ERROR: No data. Check Race/Date or Internet. Proxy may be blocked.";
        return;
    }
    
    status.innerText = "Got data. Parsing...";
    parseAndCalc(text);
}

function parseAndCalc(rawText){
    let lines = rawText.trim().split('\n');
    let data = [];
    let html = "<table><tr><th>Rk</th><th>Horse</th><th>Win</th><th>Place</th><th>Gap</th></tr>";

    lines.forEach(line => {
        line = line.trim();
        if(line == "" || line.toLowerCase().includes("no data")) return;
        let cols = line.split(',');
        if(cols.length >= 4){
            data.push({
                no: cols[0].trim(),
                horse: cols[1].trim(),
                win: parseFloat(cols[2]) || 999,
                place: parseFloat(cols[3]) || 999
            });
        }
    });

    if(data.length == 0){
        document.getElementById('status').innerText = "ERROR: Parsed 0 runners. Raw data format may have changed.";
        return;
    }

    // CALC: Sort by Win Div Low to High
    data.sort((a,b) => a.win - b.win);

    data.forEach((d,i) => {
        let gap = i>0? (d.win - data[i-1].win).toFixed(2) : "-";
        let gapClass = parseFloat(gap) > 2.0 ? 'class="gapbig"' : ''; // Example: highlight big gaps
        let rowClass = i < 5 ? 'class="q5"' : ''; // Top 5 = Q5
        
        html += `<tr ${rowClass}>
            <td>${i+1}</td>
            <td style="text-align:left">${d.no}. ${d.horse}</td>
            <td>${d.win}</td>
            <td>${d.place}</td>
            <td ${gapClass}>${gap}</td>
        </tr>`;
    });
    html += "</table>";

    document.getElementById('output').innerHTML = html;
    document.getElementById('status').innerText = `Done. Loaded ${data.length} runners. Green = Top 5 by Win`;
}
</script>

</body>
</html>
