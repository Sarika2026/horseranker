<!DOCTYPE html>
<html>
<head>
<title>HorseRanker V4</title>
<style>
  body {font-family: Arial; padding: 20px; background:#111; color:#fff;}
  textarea {width:100%; height:200px; background:#222; color:#fff; border:1px solid #555;}
  button {padding:12px 20px; background:#00ff88; border:none; font-weight:bold; cursor:pointer; margin-top:10px;}
  #results {margin-top:20px;}
 .horse {padding:8px; border-bottom:1px solid #333;}
</style>
</head>
<body>
<h1>🏇 HorseRanker V4</h1>

<h3>Step 1: Copy from OZbet</h3>
<p>Open OZbet race > Ctrl+A > Ctrl+C > Paste below</p>
<textarea id="ozbetPaste" placeholder="Paste OZbet race page here..."></textarea>
<br>
<button onclick="parseData()">PARSE & RANK HORSES</button>

<div id="results"></div>

<script>
function parseData(){
  let text = document.getElementById('ozbetPaste').value;
  let lines = text.split('\n');
  let horses = [];

  // Regex to catch: "1. HORSE NAME 3.50 57.0kg"
  lines.forEach(line => {
    let match = line.match(/(\d+)[\.\)]\s+([A-Za-z0-9\s\-\'\(\)]+?)\s+([\d\.]+)\s+([\d\.]+)kg/i);
    if(match){
      horses.push({
        number: match[1],
        name: match[2].trim(),
        odds: parseFloat(match[3]),
        weight: parseFloat(match[4])
      });
    }
  });

  if(horses.length === 0){
    document.getElementById('results').innerHTML = "No horses found. Make sure you pasted the full race page.";
    return;
  }

  // Ranking Formula: Better odds + Lighter weight = Higher score
  horses.forEach(h => {
    h.score = (1/h.odds * 100) + (60 - h.weight);
  });
  horses.sort((a,b) => b.score - a.score);

  let result = '<h3>🏆 Ranked Horses</h3>';
  horses.forEach((h,i) => {
    result += `<div class="horse"><b>${i+1}. #${h.number} ${h.name}</b> <br> Odds: $${h.odds} | Weight: ${h.weight}kg | Score: ${h.score.toFixed(2)}</div>`;
  });
  document.getElementById('results').innerHTML = result;
}
</script>
</body>
</html>
